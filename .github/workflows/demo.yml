# Publishes the browser demo (scripts/build-demo.js) to GitHub Pages whenever main changes: the real board, running in
# the visitor's browser with made-up data. No dependencies to install.
name: Demo page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/demo.test.js test/fuzz.test.js
      - run: node scripts/build-demo.js _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    # Waits until Pages is switched on for the repo and the variable DEMO_PAGES is set to on, so pushes stay green before.
    if: vars.DEMO_PAGES == 'on'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
