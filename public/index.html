<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E1116">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Switchboard">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Switchboard</title>
<style>
/* One dark look on purpose: the lights are the content, the rest stays quiet. */
:root{
  --bg:#0E1116; --panel:#141922; --panel2:#1B212C; --line:#222935; --line2:#2A3342;
  --ink:#E8ECF2; --soft:#B4BECC; --muted:#8792A3; --dim:#6F7C8F;
  --gold:#F5C451; --gold-ink:#2b1f00; --gold-bg:#1E1A10; --gold-line:#6B5215; --gold-soft:#B9A66E;
  --blue:#5AA9FF; --green:#3DD68C; --red:#FF6B57; --red-bg:#2A1512; --red-line:#5E2A22;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
.wrap{max-width:1360px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:800;white-space:nowrap}
.mark{display:flex;gap:4px}
.mark i{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.mark i:nth-child(2){background:var(--blue);box-shadow:0 0 10px var(--blue)}
.mark i:nth-child(3){background:var(--green);box-shadow:0 0 10px var(--green)}
.cmd{flex:1 1 320px;display:flex;align-items:center;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:0 6px 0 14px;min-width:0}
.cmd:focus-within{border-color:var(--gold)}
.cmd input{flex:1;min-width:0;background:none;border:0;outline:0;padding:12px 0}
.cmd input::placeholder{color:var(--dim)}
.mic{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 8px;border-radius:8px;font-size:13px;font-weight:700}
.mic.on{color:var(--red)}
kbd{font:700 11px var(--font);background:rgba(0,0,0,.25);border-radius:5px;padding:1px 6px;margin-left:6px}
.cmd kbd{background:var(--panel2);color:var(--muted);font-size:12px;padding:3px 8px}
.pills{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 100%}
.pill{font-size:13px;font-weight:700;padding:8px 13px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);background:none;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.go{border-color:var(--gold-line);color:var(--gold)}
.pill kbd{margin:0;background:var(--panel2);color:var(--muted)}
.pill[aria-pressed="true"] kbd{background:rgba(0,0,0,.14);color:var(--bg)}
.sw{width:9px;height:9px;border-radius:3px}
.ct{background:var(--gold);color:var(--gold-ink);border-radius:999px;font-size:11px;padding:0 6px;line-height:17px}

h1{font-size:clamp(26px,4.2vw,36px);font-weight:800;letter-spacing:-.025em;margin:24px 0 0;line-height:1.1;text-wrap:balance}
h1 em{font-style:normal;color:var(--gold)}
h1.zero em{color:var(--green)}
.sub{color:var(--muted);margin-top:8px;display:flex;gap:6px 20px;flex-wrap:wrap;align-items:center}
.dotk{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}
.A{background:transparent;box-shadow:inset 0 0 0 2px var(--gold)}.L{background:#E8922E}
.Y{background:var(--gold)}.B{background:var(--blue)}.G{background:var(--green)}.R{background:var(--red)}.D{background:var(--line2)}
.lab{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lab.gold{color:var(--gold)}
.link{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;font-size:12px;font-weight:700;letter-spacing:0;text-transform:none}

.q{background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:16px;overflow:hidden}
.row{border-top:1px solid #3A2F12}
.row:first-child{border-top:0}
.row.red{background:var(--red-bg);border-top-color:var(--red-line)}
.row.sel{box-shadow:inset 3px 0 0 var(--gold)}
.row.red.sel{box-shadow:inset 3px 0 0 var(--red)}
.head{display:flex;align-items:center;gap:8px 14px;padding:12px 16px;flex-wrap:wrap;cursor:pointer}
.n{font-size:18px;font-weight:800;color:var(--gold);width:16px;flex:none}
.red .n{color:var(--red)}
.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;color:#0E1116;white-space:nowrap;flex:none}
.txt{flex:1 1 260px;min-width:0}
.txt p{margin:0;font-weight:600;overflow-wrap:anywhere}
.txt small{display:block;font-size:13px;color:var(--gold-soft);margin-top:3px;overflow-wrap:anywhere}
.red .txt small{color:#E0A59B}
.txt .next{color:#8FB4DF;font-weight:600;font-size:12px;margin-top:5px;display:block}
.tg{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:8px;vertical-align:1px;border:1px solid var(--gold-line);color:var(--gold-soft);white-space:nowrap}
.tg.due{border-color:var(--red);color:#FF9C8E}
.tg.val{border-color:var(--green);color:var(--green)}
.est{font-size:12px;color:var(--gold-soft);font-weight:600;white-space:nowrap}
.btns{display:flex;gap:6px;flex-wrap:wrap}
#headline .untimed{font-size:.5em;font-weight:600;color:var(--soft);white-space:nowrap}
.btns.one{flex-wrap:nowrap}.btns.one.wrap{flex-wrap:wrap}
.btn{font-size:13px;font-weight:700;padding:8px 13px;border-radius:8px;background:var(--gold);color:var(--gold-ink);border:1px solid var(--gold);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center}
.btn.gh{background:transparent;border-color:var(--gold-line);color:var(--gold)}
.red .btn{background:var(--red);border-color:var(--red);color:#2a0803}
.red .btn.gh{background:transparent;border-color:var(--red-line);color:#FF9C8E}
.btn.plain{background:transparent;border-color:var(--line2);color:var(--soft)}
.btn:disabled{opacity:.5;cursor:progress}
.more{padding:0 16px 14px 46px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.pane{background:var(--bg);border:1px solid #3A2F12;border-radius:10px;padding:12px 14px;min-width:0}
.pane h5{margin:0 0 7px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pane p{margin:0;font-size:14px;line-height:1.5;color:#D5DBE5;white-space:pre-wrap;overflow-wrap:anywhere}
.pane p + p{margin-top:6px}
.longdraft{display:grid;gap:8px;justify-items:start} .longdraft .showall{font-size:12px;padding:5px 11px}
.chg{font-weight:600;margin-bottom:8px}
.chg s{color:var(--muted);font-weight:400}.chg b{color:var(--green)}
textarea{width:100%;min-height:110px;background:var(--bg);border:1px solid var(--gold-line);border-radius:8px;padding:10px;resize:vertical;line-height:1.5}
.inline{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.inline input{flex:1 1 200px;background:var(--bg);border:1px solid var(--gold-line);border-radius:8px;padding:8px 10px;min-width:0}
.snz input{background:var(--bg);border:1px solid var(--gold-line);border-radius:8px;padding:6px 8px}
.snz{padding:0 16px 12px 46px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--gold-soft)}
.chgline s{color:var(--muted)}.chgline b{color:var(--green)}
.grouplist{max-height:220px;overflow:auto}
.banner.held{border-style:solid;border-color:var(--gold-line);background:var(--gold-bg);align-items:flex-start}
.heldlist{flex:1 1 100%;display:grid;gap:6px}
.heldrow{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap}
.heldrow>span{flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.rest{display:block;width:100%;background:none;border:0;border-top:1px solid #3A2F12;color:var(--gold);font-weight:700;padding:13px;cursor:pointer;text-align:center}

.banner{margin-top:10px;border:1px dashed #3A4658;border-radius:12px;padding:11px 16px;display:flex;align-items:center;gap:10px 14px;color:var(--soft);flex-wrap:wrap}
.banner span{flex:1 1 260px}.banner b{color:var(--ink)}
.banner.sim{border-style:solid;border-color:#3A4658;background:#101826;margin:14px 0 0}
.calm{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:var(--soft)}
.calm b{color:var(--green);display:block;font-size:12px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-height:140px;display:flex;flex-direction:column;text-align:left;cursor:pointer;color:inherit}
.box[aria-pressed="true"]{border-color:var(--ink)}
.box.sleep{opacity:.45}
.lights{display:flex;gap:8px;align-items:center;min-height:14px;margin-bottom:11px;flex-wrap:wrap}
.lt{width:11px;height:11px;border-radius:50%;background:var(--line2);flex:none}
.lt.a{background:transparent;box-shadow:inset 0 0 0 2px var(--gold)}
.lt.late{background:#E8922E}
.tag.warn{background:#3A2A12;color:#F0B060}
.tg a{color:inherit}
.lt.y{background:var(--gold);box-shadow:0 0 12px 2px rgba(245,196,81,.75)}
.lt.r{background:var(--red);box-shadow:0 0 12px 2px rgba(255,107,87,.75)}
.lt.b{background:var(--blue);box-shadow:0 0 10px 1px rgba(90,169,255,.55)}
.lt.g{background:var(--green);box-shadow:0 0 10px 1px rgba(61,214,140,.55)}
.x{font-size:12px;font-weight:800;margin-left:-4px;color:var(--muted)}
.bh{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800}
.bh i{width:11px;height:11px;border-radius:4px;flex:none}
.say{font-size:13.5px;color:var(--soft);margin-top:6px}
.connect{min-width:0} .li .connect{flex:1 1 100%;margin-top:0} .say.connect p{margin:10px 0 0;font-weight:400;flex:none} .connect a{color:var(--blue)} .cline{display:flex;gap:8px;align-items:center;margin-top:6px} .cline code{flex:1 1 auto;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;color:var(--ink)}
.addbox{border:1px dashed var(--line2);background:none;align-items:center;justify-content:center;color:var(--muted);font-weight:700}

.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;gap:8px 12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li p{margin:0;flex:1 1 240px;min-width:0;font-weight:600;overflow-wrap:anywhere}
.li small{color:var(--muted);font-size:12.5px;font-weight:400;display:block}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.tag.b{background:#1B2B40;color:#8FC2FF}
.bar{height:5px;border-radius:3px;background:var(--line2);overflow:hidden;flex:0 0 120px}
.bar i{display:block;height:100%;background:var(--green)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px);display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;z-index:30}
.toast button{background:none;border:0;color:#1F4E8C;font-weight:800;cursor:pointer;padding:0}
.foot{margin-top:28px;font-size:12px;color:var(--dim);display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center}

/* Rapid mode: one quick decision at a time, nothing else on screen. */
#rapid{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.rwrap{max-width:720px;margin:0 auto;display:grid;gap:16px}
.rtop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:600;gap:12px}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line2)}
.prog i.on{background:var(--gold)}
.rcard{background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:20px;padding:22px;display:grid;gap:14px}
.rcard.red{background:var(--red-bg);border-color:var(--red-line)}
.tg,.rcard h2,.head p,.say{overflow-wrap:anywhere}
.tg,.tag{white-space:normal;max-width:100%}
.pane.wide{grid-column:1/-1} .pane.wide #edit-text{width:100%;min-height:96px;font:inherit} .tellbox{margin:10px 0 6px;padding-top:10px;border-top:1px solid var(--line)} .tellbox textarea{width:100%;min-height:52px;margin:4px 0 6px;font:inherit} .chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0} .chip-btn{font:inherit;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--gold-line);background:transparent;color:var(--gold-soft);cursor:pointer} .pane.wide textarea{width:100%;min-height:58px;margin:4px 0 8px;font:inherit;resize:vertical} .allview{margin:18px 0} .allbar{display:flex;flex-direction:column;gap:8px;margin:8px 0 12px} .allbar input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:inherit} .allgroup{margin:14px 0} .allgroup .bh{margin:6px 0} .allrow{cursor:pointer} .allnote{display:block;white-space:pre-wrap;margin-top:6px;color:var(--muted);font-size:13px} .banner.since{flex-direction:column;align-items:stretch} .sincelist p{margin:4px 0} .checkline p{margin:2px 0} .warnline{color:#FF9C8E;font-weight:600} .pane .diff{white-space:pre-wrap;line-height:1.55} .pane .diff ins{background:rgba(76,176,90,.25);color:inherit;text-decoration:none;border-radius:3px;padding:0 2px} .pane .diff del{color:#FF9C8E;opacity:.8} .askback{margin:8px 0;padding:8px 10px;border-left:3px solid var(--gold);background:rgba(245,166,35,.06)} .askback textarea{width:100%;margin:6px 0;font:inherit} .pane.asked q{color:var(--gold-soft)} .pane.asked .before{opacity:.75;white-space:pre-wrap} .pane.asked details{margin-top:6px} .pane.asked summary{cursor:pointer;color:var(--muted)}
@media (hover:none){ kbd,.keys{display:none} }
@media (max-width:640px){ h1{font-size:24px;margin-top:14px} #sub{font-size:13px;gap:4px 12px} .grid.boxes{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding-bottom:6px} .grid.boxes>.box{flex:0 0 78%;scroll-snap-align:start} .btn.gothrough{width:100%;justify-content:center;padding:14px;margin:10px 0;font-size:16px} .toast{top:max(10px,env(safe-area-inset-top));bottom:auto} }
.rcard h2{margin:0;font-size:clamp(22px,4vw,28px);line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.rcard .more{padding:0}
.rcard .btn{padding:13px 18px;font-size:15px}
.rcard .snz{padding:0}
@media (max-width:640px){ .more{padding-left:16px} .snz{padding-left:16px} .est{order:3} .head .btns{flex:1 1 100%} .btn{flex:1 1 auto;justify-content:center;padding:11px 10px} kbd{display:none} .pill,.areasel,.drawer>summary,.btn,.mic{min-height:44px} .count .link,.foot .link{display:inline-flex;align-items:center;min-height:44px} .ck{min-height:44px} }
/* The first screen: a broken box, three groups (safe, read first, needs you), a short list, and folded drawers. */
.areasel{font-size:13px;font-weight:700;padding:8px 30px 8px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--soft);cursor:pointer;max-width:100%;min-width:0;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.areasel.on{border-color:var(--ink);color:var(--ink)}
/* 16px on a phone: iPhone Safari zooms into any form control with smaller text, and stays zoomed. */
@media (max-width:640px){ .areasel{font-size:16px} }
.count{color:var(--muted);font-size:13.5px}
.count .link{font-size:13.5px}
.brokenbox{background:var(--red-bg);border-color:var(--red-line);margin-top:18px}
.brokenbox .row{border-top-color:var(--red-line)}
.brokenbox .mini .head{cursor:pointer;padding-top:8px;padding-bottom:8px} .brokenbox .mini p,.brokenbox .mini small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .brokenbox .mini .txt{min-width:0}
@media (max-width:640px){ .brokenbox .txt>small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden} }
.bbhead{padding:10px 16px 0;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.stk{font-size:11px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:5px;border:1px solid var(--red-line);color:#FF9C8E;white-space:nowrap;flex:none}
.stk.safe{border-color:#1F5A3E;color:var(--green)}.stk.read{border-color:var(--gold-line);color:var(--gold)}
.impact{display:block;font-size:13px;color:var(--soft);margin-top:4px}
.impact.none{color:#F0B060}
.lane{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ck{display:flex;gap:12px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);cursor:pointer}
.ck:first-child{border-top:0}
.ck input{width:20px;height:20px;flex:none;accent-color:var(--gold)}
.ck span{flex:1;min-width:0;overflow-wrap:anywhere}
.ck small{display:block;color:var(--muted);font-size:12.5px}
.lanego{padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.lanego .note{color:var(--muted);font-size:12.5px;flex:1 1 180px}
.drawer{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
.drawer>summary{cursor:pointer;padding:12px 16px;font-weight:700;color:var(--soft);list-style:none;display:flex;align-items:center;gap:8px}
.drawer>summary::-webkit-details-marker{display:none}
.drawer>summary::after{content:'\25B8';margin-left:auto;color:var(--muted)}
.drawer[open]>summary::after{content:'\25BE'}
.drawer>summary small{color:var(--muted);font-weight:600}
.drawer .list,.drawer .lane{border:0;border-radius:0;border-top:1px solid var(--line)}
.drawer .grid{padding:12px}
.drawer .sincelist{padding:4px 16px 0}
.drawer.read{margin-top:0}
.subhead{padding:8px 16px 0;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.boxpills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;min-height:22px}
.bp{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--gold-line);color:var(--gold)}
.bp.r{border-color:var(--red);color:#FF9C8E}
.cols{display:grid;gap:0 28px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){ .cols.two{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)} .top{flex-wrap:nowrap} .top .pills{flex:0 1 auto} }
.finish{display:grid;gap:12px}
.finish .btns{margin-top:4px}
.rtop .clock{color:var(--gold);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){ .lt.y,.lt.r{animation:pulse 2.4s ease-in-out infinite} @keyframes pulse{50%{opacity:.6}} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="mark"><i></i><i></i><i></i></span>Switchboard</div>
    <form class="cmd" id="dump"><input id="dump-text" maxlength="1000" autocomplete="off" aria-label="Add anything" placeholder="Add anything, or “I have 10 min”"><button class="mic" id="mic" type="button" hidden aria-label="Speak instead of typing">Speak</button><kbd id="kbd-k">⌘K</kbd></form>
    <div class="pills" id="pills"></div>
  </div>
  <h1 id="headline">Loading…</h1>
